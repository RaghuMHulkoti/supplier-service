# ──────────────────────────────────────────────────────────────────────────────
# supplier-service — Service
#
# ClusterIP — exposes the service on a cluster-internal IP.
# Traffic is routed to this service through the Kubernetes Ingress controller.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: supplier-service
spec:
  type: ClusterIP             # default type, only accessible inside the cluster
  selector:
    app: supplier-service     # matches Deployment pod label
  ports:
    - name: http
      protocol: TCP
      port: 80                # port exposed by the service inside the cluster
      targetPort: 8080        # container port

