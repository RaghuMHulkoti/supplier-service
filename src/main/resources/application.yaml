
spring:
  application:
    name: supplier_service

  datasource:
    url: jdbc:postgresql://YOUR_AIVEN_HOST:28780/defaultdb?sslmode=require&currentSchema=%22Inventory%22
    username: avnadmin
    password: AVNS_yGow9uoMWcZbMVMfRk8
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: alpha
    tryItOutEnabled: true
    displayOperationId: true
  show-actuator: false
  use-fqn: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true